<!--
  Supabase "Invite user" email template.

  NOT read by the server. Supabase renders its own copy of this template,
  configured in the dashboard: Authentication -> Emails -> Templates ->
  "Invite user". Paste this file's body there whenever it changes - this file
  is the version-controlled source of truth for that copy.

  Subject line to set in the same screen:
    הוזמנת לייצג את הארגון שלך ב-Equalmind

  Variables (Go templates):
    {{ .ConfirmationURL }}          the accept link Supabase generates
    {{ .Data.full_name }}           from the invite form's "שם הנציג.ה"
    {{ .Data.organization_name }}   from organizations.name

  Both Data fields are optional - the scripts in server/scripts invite
  without them - so every use has a fallback. The template is global: it is
  also what any other inviteUserByEmail call sends.
-->
<div dir="rtl" lang="he" style="font-family: Arial, Helvetica, sans-serif; color: #0e2e1c; line-height: 1.7; max-width: 560px; margin: 0 auto; padding: 24px; text-align: right;">
  <h2 style="margin: 0 0 16px; font-size: 22px; color: #15803d;">Equalmind</h2>

  <p style="margin: 0 0 12px; font-size: 16px;">
    הי{{ if .Data.full_name }} {{ .Data.full_name }}{{ end }},
  </p>

  <p style="margin: 0 0 12px; font-size: 16px;">
    מונית/ה לנציג/ת הארגון{{ if .Data.organization_name }} <strong>{{ .Data.organization_name }}</strong>{{ end }} ב-Equalmind.
  </p>

  <p style="margin: 0 0 24px; font-size: 16px;">
    הזמנה זו תאפשר לך להזמין אנשים מהארגון שלך להצטרף ל-Equalmind.
  </p>

  <p style="margin: 0 0 24px;">
    <a href="{{ .ConfirmationURL }}"
       style="display: inline-block; background: #15803d; color: #ffffff; text-decoration: none; font-weight: bold; font-size: 16px; padding: 12px 28px; border-radius: 10px;">
      קבלת ההזמנה
    </a>
  </p>

  <p style="margin: 0; font-size: 13px; color: #64748b;">
    אם לא ציפית להזמנה הזו, אפשר להתעלם מהמייל.
  </p>
</div>
